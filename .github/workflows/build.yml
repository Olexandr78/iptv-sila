name: IPTV-SILA Android + Android TV
on:
  workflow_dispatch:
  push:
    branches: [android]
permissions:
  contents: read
jobs:
  android:
    name: Build Android phone/tablet and Android TV APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APKs
        run: gradle --no-daemon assembleStandardDebug assembleTvDebug
      - name: Upload Android phone/tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-Android-debug
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-Android-TV-debug
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
