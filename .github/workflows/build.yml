name: IPTV-SILA native iOS (real iPhone)
on:
  workflow_dispatch:
  push:
    branches: [ios]
permissions:
  contents: read
jobs:
  ios-device:
    name: Compile native UIKit app for physical iPhone
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        run: xcodegen generate
      - name: Build for physical iPhone hardware (arm64, not simulator)
        run: |
          xcodebuild \
            -project IPTV-SILA.xcodeproj \
            -scheme IPTV-SILA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned device IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/IPTV-СИЛА.app"
          if [ ! -d "$APP_PATH" ]; then APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"; fi
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry IPTV-SILA-native-iPhone-arm64-iOS12-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-native-iPhone-arm64-iOS12-unsigned-IPA
          path: IPTV-SILA-native-iPhone-arm64-iOS12-unsigned.ipa
          if-no-files-found: error
