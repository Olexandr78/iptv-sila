name: IPTV-SILA iOS 12 - real iPhone
on:
  workflow_dispatch:
  push:
    branches: [ios]
permissions:
  contents: read
jobs:
  ios-device:
    name: Build arm64 app for a physical iPhone (iOS 12+)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare web client
        run: |
          mkdir -p www
          cp -R web/. www/
      - name: Install Cordova iOS toolchain
        run: |
          npm install --global cordova@11
          cordova platform add ios@6.2.0
      - name: Locate native Xcode project and scheme
        id: project
        run: |
          PROJECT="$(find platforms/ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Compile for real iPhone hardware (arm64, not simulator)
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO
      - name: Package device app as unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry IPTV-SILA-iPhone-arm64-iOS12-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-iPhone-arm64-iOS12-unsigned-IPA
          path: IPTV-SILA-iPhone-arm64-iOS12-unsigned.ipa
          if-no-files-found: error
