name: IPTV-SILA Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows GUI client and LAN server
        run: pyinstaller --noconfirm --clean --windowed --onedir --name IPTV-SILA --collect-all PySide6 app.py
      - name: Package portable app
        shell: pwsh
        run: |
          Copy-Item README.md dist/IPTV-SILA/README.txt
          Compress-Archive -Path dist/IPTV-SILA -DestinationPath IPTV-SILA-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-Windows-x64-Desktop-Client-and-Server
          path: IPTV-SILA-Windows-x64.zip
          if-no-files-found: error