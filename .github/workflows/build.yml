name: IPTV-SILA Windows
on:
  workflow_dispatch:
  push:
    branches: [windows]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable Windows app
        run: pyinstaller --noconfirm --clean --onedir --name IPTV-SILA --add-data "web;web" server.py
      - name: Add example configuration
        shell: pwsh
        run: Copy-Item config.example.json dist/IPTV-SILA/config.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-Windows-x64
          path: dist/IPTV-SILA/
          if-no-files-found: error
