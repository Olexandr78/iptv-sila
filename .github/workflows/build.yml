name: IPTV-SILA iOS 12
on:
  workflow_dispatch:
  push:
    branches: [ios]
permissions:
  contents: read
jobs:
  ios-unsigned:
    name: Build unsigned iOS 12-compatible IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Cordova web app
        run: |
          mkdir -p www
          cp -R web/. www/
      - name: Install Cordova toolchain
        run: |
          npm install --global cordova@11
          cordova platform add ios@6.2.0
      - name: Locate Xcode project and scheme
        id: project
        run: |
          PROJECT="$(find platforms/ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Build for physical iOS devices without signing
        run: |
          xcodebuild -project "${{ steps.project.outputs.project }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for jailbroken devices
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry IPTV-SILA-iOS12-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-SILA-iOS12-unsigned-IPA
          path: IPTV-SILA-iOS12-unsigned.ipa
          if-no-files-found: error
